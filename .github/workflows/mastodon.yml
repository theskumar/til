name: Post to Mastodon

on:
  push:
    branches: [main]
    paths: [til.md]

jobs:
  post:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: add mastodon discuss link')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post new TIL entries to Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python3 scripts/post-mastodon.py

      - name: Commit discuss links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add til.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: add mastodon discuss link"
            git push
          fi
